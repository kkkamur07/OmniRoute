<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OmniRoute Sign-in Helper</title>
    <link rel="stylesheet" href="approve.css" />
  </head>
  <body class="page-popup">
    <header class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <rect width="32" height="32" rx="8" fill="currentColor" opacity="0.14" />
        <g stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
          <path d="M16 13 8 8M16 13l8-5M16 19l-8 5M16 19l8 5M16 13V5M16 19v8" />
        </g>
        <g fill="currentColor">
          <circle cx="16" cy="16" r="3" />
          <circle cx="8" cy="8" r="2" />
          <circle cx="24" cy="8" r="2" />
          <circle cx="8" cy="24" r="2" />
          <circle cx="24" cy="24" r="2" />
          <circle cx="16" cy="5" r="1.5" />
          <circle cx="16" cy="27" r="1.5" />
        </g>
      </svg>
      <div>
        <h1 class="brand-name">OmniRoute</h1>
        <p class="brand-sub">Sign-in Helper</p>
      </div>
    </header>
    <section class="card">
      <h2 class="section-label">Approved dashboards</h2>
      <p id="empty" class="muted">None yet. Approve a dashboard from its Connect dialog.</p>
      <ul id="list" class="approved-list"></ul>
      <p id="status" class="status" role="status"></p>
    </section>
    <footer>Nothing leaves your browser except the redirect to your own dashboard.</footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
