<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OmniRoute Sign-in Helper</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #1b1f24;
        --muted: #5b6470;
        --border: #d5dae0;
        --accent: #1a56db;
        --accent-fg: #ffffff;
        --danger: #b42318;
        --focus: #1a56db;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16191d;
          --fg: #e8ebef;
          --muted: #9aa4b0;
          --border: #343b44;
          --accent: #5b8cff;
          --accent-fg: #0b1020;
          --danger: #ff8a80;
          --focus: #8fb0ff;
        }
      }
      body {
        width: 340px;
        margin: 0;
        padding: 16px;
        box-sizing: border-box;
        background: var(--bg);
        color: var(--fg);
        font:
          14px/1.4 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 15px;
      }
      h2 {
        margin: 16px 0 6px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
      }
      p {
        margin: 6px 0;
      }
      .origin {
        font-family: ui-monospace, Menlo, Consolas, monospace;
        word-break: break-all;
      }
      .muted {
        color: var(--muted);
      }
      .status {
        min-height: 1.4em;
        margin-top: 8px;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 6px 0;
        border-bottom: 1px solid var(--border);
      }
      button {
        font: inherit;
        padding: 6px 12px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--fg);
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-fg);
      }
      button.remove {
        color: var(--danger);
        flex: none;
      }
      button:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }
      [hidden] {
        display: none;
      }
      footer {
        margin-top: 16px;
        font-size: 12px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <h1>OmniRoute Sign-in Helper</h1>
    <p class="muted">
      Dashboards are approved from the Connect dialog of your OmniRoute dashboard.
    </p>
    <section>
      <h2>Approved dashboards</h2>
      <p id="empty" class="muted">None yet.</p>
      <ul id="list"></ul>
      <p id="status" class="status" role="status"></p>
    </section>
    <footer>Nothing leaves your browser except the redirect to your own dashboard.</footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
